name: C++ CI
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then echo 'CC=gcc' >> "$GITHUB_ENV"; echo 'CXX=g++' >> "$GITHUB_ENV"; else echo 'CC=clang' >> "$GITHUB_ENV"; echo 'CXX=clang++' >> "$GITHUB_ENV"; fi
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DWORLDGEN_ENABLE_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build --output-on-failure
